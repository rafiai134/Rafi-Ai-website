<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050816">
  <meta name="description" content="Rafi AI — Your personal AI command center">
  <title>Rafi AI</title>

  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">

  <style>
    /* Rafi AI Command Center */
    .rafi-command-center {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
    }

    .rafi-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
    }

    .rafi-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rafi-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 35% 30%, #ffffff, #7c5cff 25%, #20d9ff 60%, #071126 100%);
      box-shadow: 0 0 35px rgba(78, 170, 255, .55);
      font-weight: 900;
      color: white;
    }

    .rafi-brand h1 {
      margin: 0;
      font-size: 22px;
    }

    .rafi-brand p {
      margin: 3px 0 0;
      opacity: .65;
      font-size: 13px;
    }

    .rafi-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      opacity: .8;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #35e889;
      box-shadow: 0 0 12px #35e889;
    }

    .rafi-orb-area {
      min-height: 270px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      margin-bottom: 22px;
      background:
        radial-gradient(circle at center,
          rgba(78, 130, 255, .16),
          transparent 35%),
        rgba(7, 12, 30, .55);
      border: 1px solid rgba(255,255,255,.08);
    }

    .rafi-orb {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 32% 28%,
          #fff 0 4%,
          #9d8cff 8%,
          #596cff 25%,
          #20d9ff 55%,
          #061126 78%);
      box-shadow:
        0 0 25px rgba(91,115,255,.75),
        0 0 70px rgba(31,210,255,.35),
        inset 0 0 35px rgba(255,255,255,.25);
      animation: rafiPulse 3s ease-in-out infinite;
    }

    .rafi-orb::before,
    .rafi-orb::after {
      content: "";
      position: absolute;
      inset: -30px;
      border: 1px solid rgba(77,190,255,.28);
      border-radius: 50%;
      animation: rafiOrbit 7s linear infinite;
    }

    .rafi-orb::after {
      inset: -52px;
      border-color: rgba(135,102,255,.18);
      animation-duration: 11s;
      animation-direction: reverse;
    }

    .rafi-orb-label {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      opacity: .65;
    }

    @keyframes rafiPulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes rafiOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .rafi-layout {
      display: grid;
      grid-template-columns: 1.45fr .75fr;
      gap: 20px;
    }

    .rafi-panel {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(8,14,32,.72);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      overflow: hidden;
    }

    .rafi-panel-head {
      padding: 17px 18px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rafi-panel-head strong {
      font-size: 15px;
    }

    .rafi-panel-head span {
      font-size: 11px;
      opacity: .55;
    }

    #chatMessages {
      height: 390px;
      overflow-y: auto;
      padding: 18px;
    }

    .rafi-welcome {
      text-align: center;
      padding: 55px 20px;
      opacity: .72;
    }

    .rafi-welcome h2 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .rafi-welcome p {
      margin: 0;
      font-size: 13px;
    }

    .rafi-input-area {
      padding: 14px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .rafi-input-row {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    #userInput {
      flex: 1;
      min-height: 48px;
      resize: none;
      border-radius: 16px;
      padding: 13px 15px;
    }
