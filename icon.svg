<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t d">
<title id="t">Rafi AI mobile logo</title><desc id="d">A luminous circuit human profile beside the Rafi AI wordmark, matching the supplied reference.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop stop-color="#061a3d"/><stop offset=".62" stop-color="#02091d"/><stop offset="1" stop-color="#00040d"/></radialGradient>
<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00f6ff"/><stop offset=".55" stop-color="#287bff"/><stop offset="1" stop-color="#9a3dff"/></linearGradient>
<linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffad21"/><stop offset=".45" stop-color="#ff2698"/><stop offset="1" stop-color="#a33cff"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#d7e7f7"/><stop offset="1" stop-color="#738ba4"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1024" height="1024" rx="150" fill="url(#bg)"/>
<g opacity=".35" stroke="#1267ff" fill="none" stroke-width="3">
<path d="M0 125h155l75-75h125M1024 180H850l-65-65H650M0 780h170l60-60h120M1024 740H850l-55 55H650"/>
</g>
<ellipse cx="350" cy="745" rx="330" ry="38" fill="#005cff" opacity=".22" filter="url(#soft)"/>
<g transform="translate(62 150)" filter="url(#glow)">
<!-- human/circuit profile -->
<path d="M430 40C300 5 165 77 151 208C62 242 66 373 158 401C140 503 224 574 307 529L374 475C412 444 433 405 433 354C478 330 494 279 474 231C454 185 458 103 430 40Z" fill="none" stroke="url(#cyan)" stroke-width="24" stroke-linejoin="round"/>
<path d="M430 40C457 87 463 157 474 231C494 279 478 330 433 354" fill="none" stroke="#23e8ff" stroke-width="9"/>
<!-- face -->
<path d="M403 211Q445 238 452 279Q455 316 422 331L390 345Q365 335 354 306L369 270L357 235Z" fill="url(#silver)" opacity=".9"/>
<path d="M402 250l40 20-34 12 29 20-40 8" fill="none" stroke="#fff" stroke-width="6"/>
<!-- circuit traces -->
<path d="M55 160H270L330 119M20 255H251L325 183M48 350H238L327 247M83 445H236L325 306M126 535H244L322 366" fill="none" stroke="url(#cyan)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M325 119V390M325 183L391 219M325 247L394 283M325 306L379 344M325 365L358 395" fill="none" stroke="url(#warm)" stroke-width="15" stroke-linecap="round"/>
<g fill="#00eaff"><circle cx="55" cy="160" r="15"/><circle cx="20" cy="255" r="15"/><circle cx="48" cy="350" r="15"/><circle cx="83" cy="445" r="15"/></g>
<g fill="#ff9e20"><circle cx="126" cy="535" r="15"/><circle cx="325" cy="119" r="10"/></g>
<g fill="#ff35a9"><circle cx="325" cy="247" r="10"/><circle cx="325" cy="306" r="10"/></g>
</g>
<!-- wordmark -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="800">
<text x="535" y="525" font-size="155" fill="#f8fbff">Rafi</text>
<text x="825" y="525" font-size="155" fill="url(#warm)">AI</text>
<path d="M548 580H940" stroke="url(#warm)" stroke-width="7"/>
<text x="548" y="640" font-size="34" letter-spacing="8" fill="#eaf4ff">YOUR VIRTUAL ASSISTANT</text>
</g>
</svg>