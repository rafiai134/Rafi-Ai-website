<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071a3d"/>
    <stop offset="100%" stop-color="#020817"/>
  </linearGradient>

  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#20e7ff"/>
    <stop offset="50%" stop-color="#168cff"/>
    <stop offset="100%" stop-color="#2450ff"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="512" height="512" rx="110" fill="url(#bg)"/>

<!-- Glowing outer ring -->
<circle
  cx="256"
  cy="250"
  r="205"
  fill="none"
  stroke="#159cff"
  stroke-width="8"
  opacity="0.75"
  filter="url(#glow)"
/>

<!-- Robot head -->
<rect
  x="105"
  y="125"
  width="302"
  height="190"
  rx="72"
  fill="url(#blue)"
  filter="url(#glow)"
/>

<!-- Robot face -->
<rect
  x="137"
  y="157"
  width="238"
  height="126"
  rx="48"
  fill="#06142e"
/>

<!-- Robot eyes -->
<circle cx="205" cy="215" r="15" fill="#20e7ff"/>
<circle cx="256" cy="215" r="15" fill="#20e7ff"/>
<circle cx="307" cy="215" r="15" fill="#20e7ff"/>

<!-- Antenna -->
<rect
  x="244"
  y="85"
  width="24"
  height="45"
  rx="12"
  fill="url(#blue)"
/>

<circle
  cx="256"
  cy="72"
  r="20"
  fill="#20e7ff"
  filter="url(#glow)"
/>

<!-- Side modules -->
<circle cx="98" cy="220" r="30" fill="url(#blue)"/>
<circle cx="414" cy="220" r="30" fill="url(#blue)"/>

<!-- Rafi -->
<text
  x="205"
  y="390"
  text-anchor="middle"
  font-family="Arial, sans-serif"
  font-size="62"
  font-weight="700"
  fill="#ffffff">
  Rafi
</text>

<!-- AI -->
<text
  x="340"
  y="390"
  text-anchor="middle"
  font-family="Arial, sans-serif"
  font-size="62"
  font-weight="700"
  fill="#20e7ff">
  AI
</text>

<!-- Bottom glow -->
<path
  d="M145 425 Q256 455 367 425"
  fill="none"
  stroke="#20e7ff"
  stroke-width="8"
  stroke-linecap="round"
  filter="url(#glow)"
/>

</svg>
