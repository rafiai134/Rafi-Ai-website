plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rafiai.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rafiai.companion2'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('RAFI_KEYSTORE_PATH') ?: 'rafi-release.keystore')
            storePassword System.getenv('RAFI_KEYSTORE_PASSWORD') ?: 'rafi-ai-local'
            keyAlias System.getenv('RAFI_KEY_ALIAS') ?: 'rafi-ai'
            keyPassword System.getenv('RAFI_KEY_PASSWORD') ?: 'rafi-ai-local'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
}
