plugins {
    id 'com.android.application'
}

// Fixed signing key (decoded from fixed-key.b64): every build is signed the same way,
// so a new version installs OVER the old app and keeps the token and Accessibility setting.
def fixedKeystore = new File(projectDir, 'build/fixed-release.p12')
fixedKeystore.parentFile.mkdirs()
fixedKeystore.bytes = new File(projectDir, 'fixed-key.b64').text.trim().decodeBase64()

android {
    namespace 'com.rafiai.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rafiai.companion2'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.8'
    }

    signingConfigs {
        release {
            storeFile fixedKeystore
            storePassword 'rafi-ai-local'
            keyAlias 'rafi-fixed'
            keyPassword 'rafi-ai-local'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
}
